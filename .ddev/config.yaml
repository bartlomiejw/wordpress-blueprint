name: site-project
type: wordpress
docroot: ""
php_version: "8.3"
webserver_type: nginx-fpm
database:
  type: mysql
  version: "8.0"
nodejs_version: "22"

# Expose the DDEV DB creds as the env vars wp-config.php reads
web_environment:
  - DB_NAME=wordpress
  - DB_USER=wordpress
  - DB_PASSWORD=wordpress
  - DB_HOST=db
  - WP_HOME=https://site-project.ddev.site
  - WP_ENVIRONMENT_TYPE=local
  - WP_DEBUG=true
  - WP_DEBUG_LOG=true
  - WP_DEBUG_DISPLAY=false

hooks:
  post-start:
    # Install Composer deps if vendor/ is missing
    - exec: "[ -d vendor ] || composer install"
    # Install and build the theme if its dependencies are missing
    - exec: "[ -d wp-content/themes/custom-theme/node_modules ] || (cd wp-content/themes/custom-theme && npm ci && npm run build)"
    # Install WP if not already installed
    - exec: >-
        wp core is-installed 2>/dev/null ||
        wp core install
          --url=https://site-project.ddev.site
          --title="Site Project"
          --admin_user=admin
          --admin_password=admin
          --admin_email=admin@example.com
          --skip-email