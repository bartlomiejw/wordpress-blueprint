version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # The WordPress core test library does not support PHPUnit 10+ yet (ADR 0003).
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]
    groups:
      php-dev-tools:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /
      - /wp-content/themes/custom-theme
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Major @wordpress/scripts releases change the bundled lint configs; upgrade deliberately.
      - dependency-name: "@wordpress/scripts"
        update-types: ["version-update:semver-major"]
    groups:
      wordpress-packages:
        patterns: ["@wordpress/*"]
      js-dev-tools:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ["@wordpress/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
